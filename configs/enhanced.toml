[control]
# Engineering assumption: residual is 25% of the current instantaneous Q capability.
residual_scale = 0.25
# Each candidate is re-solved at the current operating point. Includes fallback calls;
# excludes DSG search and the environment's final and next-state solves.
max_candidate_powerflows = 5
voltage_tolerance_pu = 1e-7
# If the pre-control state already violates limits, accept only commands whose maximum
# AND summed voltage violations do not increase beyond tolerance. Such steps remain
# explicitly marked as voltage-violating, never as voltage-safe.
allow_nonworsening_when_infeasible = true

[training]
# Proposed only; a formal run is launched explicitly per seed by the user.
total_timesteps = 50000
validation_interval = 5000
checkpoint_interval = 5000
progress_interval = 500
learning_starts = 1000
buffer_size = 100000
batch_size = 64
learning_rate = 0.0003
tau = 0.005
gamma = 0.99
net_arch = [64, 64]
log_every_updates = 1000
