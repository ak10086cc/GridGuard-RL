[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridguard-rl"
version = "0.1.0"
description = "Reproducible IEEE 33-bus PV reactive-power simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pandapower==3.5.6", "numpy==2.4.6", "matplotlib==3.10.8", "gymnasium==1.4.0",
                "torch==2.8.0", "stable-baselines3==2.9.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["gridguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tmp/pytest"
addopts = "-ra --basetemp=tmp/pytest_work"
